name: Auditoria isolada do POLYZILLA
on:
  push:
    branches: [audit/compatibilidade]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Instalar dependências reais de teste
        run: npm install --no-save --package-lock=false spitroast@1.4.4 react@19.1.0 react-test-renderer@19.1.0
      - name: Integração e regressões
        run: node tests/integration.mjs
      - name: Guardar compilação candidata somente na branch de auditoria
        if: github.ref == 'refs/heads/audit/compatibilidade'
        run: |
          mkdir -p release
          cp dist/index.js dist/manifest.json release/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add release/index.js release/manifest.json
          if ! git diff --cached --quiet; then
            git commit -m 'Auditoria: bundle candidato aprovado em CI'
            git push origin HEAD:audit/compatibilidade
          fi
