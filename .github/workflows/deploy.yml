name: Publicar plugin no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
      - name: Instalar dependências reais de teste
        run: npm install --no-save --package-lock=false spitroast@1.4.4 react@19.1.0 react-test-renderer@19.1.0
      - name: Executar integração antes de publicar
        run: node tests/integration.mjs
      - name: Publicar bundle também no repositório
        run: |
          mkdir -p release/meu-tradutor
          cp dist/meu-tradutor/index.js dist/meu-tradutor/manifest.json release/meu-tradutor/
          cp dist/index.js dist/manifest.json release/
          cp dist/index-*.js release/
          cp dist/meu-tradutor/index-*.js release/meu-tradutor/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add release
          if ! git diff --cached --quiet; then
            git commit -m 'Publicar bundle compilado do POLYZILLA'
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
          name: github-pages-${{ github.run_attempt }}
      - name: Aguardar disponibilidade do artefato
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: github-pages-${{ github.run_attempt }}
        run: |
          for i in $(seq 1 30); do
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '.artifacts[].name' | grep -Fxq "$ARTIFACT_NAME"; then
              exit 0
            fi
            sleep 3
          done
          echo 'Artefato não disponível para publicação.' >&2
          exit 1
      - name: Aguardar propagação no serviço Pages
        run: sleep 25
      - name: Publicar no GitHub Pages
        id: publicacao
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
